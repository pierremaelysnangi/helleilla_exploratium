# Stack d'infrastructure de développement du projet Helleilla Exploratium.
#
# Conteneurs : open-webui (UI LLM locale branchée sur Ollama hôte),
# Meilisearch, Valkey (compatible Redis) et MinIO — les mêmes services
# que ceux consommés par l'application via .env.local et par les tests
# E2E (docker-compose.test.yml, ports décalés).
#
# Notes :
# - PostgreSQL n'est PAS dans cette stack volontairement : la base de
#   données applicative est hébergée chez Supabase (DATABASE_URL /
#   DIRECT_URL dans .env.local).
# - Les credentials sont lus depuis ./.env (gitignore) ; une version
#   sanitisée est disponible dans ./.env.example.
# - Toute modification d'image se applique au prochain
#   `docker compose up -d` (les volumes persistent).

services:
  # UI de chat pour modèles locaux (Ollama sur l'hôte) — outil de dev IA,
  # indépendant du runtime Next.js.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3030:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      WEBUI_AUTH: "false" # pas d'auth en local
      ENABLE_OPENAI_API: "false"
    volumes:
      - open-webui-data:/app/backend/data

  # Moteur de recherche plein-texte alimenté par les workers BullMQ.
  # Version alignée sur les tests E2E (docker-compose.test.yml).
  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: helleilla_meili
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache + rate limiting + files BullMQ + sessions Better Auth.
  # Persistance AON activée (appendonly).
  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: helleilla_valkey
    restart: unless-stopped
    command: valkey-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Stockage S3 des médias (images de groupes / pochettes d'albums).
  # Image épinglée (évite les breaking changes du tag latest) — même
  # release que les tests E2E.
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: helleilla_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  open-webui-data:
  meili_data:
  valkey_data:
  minio_data:
