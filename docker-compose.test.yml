# Services d'intégration pour les tests E2E (tests/e2e).
# Ports décalés par rapport au dev local pour permettre une exécution
# en parallèle sans collision. Images épinglées pour la reproductibilité.
name: helleilla-e2e

services:
  postgres:
    # Image officielle pgvector (Postgres 17 + extension vector préinstallée)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e
      POSTGRES_DB: e2e
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    # Valkey : fork compatible protocole Redis, utilisé comme en prod
    image: valkey/valkey:8.1-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_MASTER_KEY: e2e_master_key_1234567890
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7701:7700"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:7700/health | grep -q available",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: e2euser
      MINIO_ROOT_PASSWORD: e2epassword
    ports:
      - "9002:9000"
